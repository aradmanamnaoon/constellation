[package]
name = "constellation-runner-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Offline authenticated, bounded user-owned runner pairing and job protocol primitives"

[dependencies]
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1.8"
