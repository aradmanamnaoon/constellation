[package]
name = "constellation-runner-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Local stdio-only authenticated Constellation runner inbox; execution disabled"

[dependencies]
constellation-runner-protocol = { path = "../constellation-runner-protocol" }
getrandom = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
