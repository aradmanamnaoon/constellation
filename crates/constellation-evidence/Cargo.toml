[package]
name = "constellation-evidence"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Deterministic, bounded, source-grounded offline lexical retrieval"
license = "MIT"

[dependencies]
flate2 = "=1.1.10" # Already resolved in Cargo.lock through lopdf/zip; direct bounded zlib reader.
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
lopdf = { version = "=0.35.0", default-features = false, features = ["nom_parser"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
quick-xml = "=0.37.5"
