[package]
name = "constellation-workflows"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Deterministic, bounded offline DAG workflow planning for local agent orchestration"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
