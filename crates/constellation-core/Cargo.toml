[package]
name = "constellation-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Durable, local-first application state and safe agent capabilities for Constellation"
license = "MIT"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
